name: Analytics & Site Build

on:
  schedule:
    # مرة يومياً (00:23 UTC): تحديث التحليلات + إعادة بناء كامل للموقع (نشر المقالات الجديدة)
    - cron: '23 0 * * *'
    # كل 3 ساعات: تحديث أرقام الزوار (24س/48س/شهر/سنة) فقط بدون إعادة بناء
    - cron: '23 1-23/3 * * *'
  workflow_dispatch: # تشغيل يدوي من GitHub أو من لوحة التحكم

jobs:
  update-analytics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Analytics (GA4)
        env:
          GA4_SECRET_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: node scripts/fetch-analytics.js

      - name: Rebuild Site (daily / manual only)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 0 * * *'
        run: npm run build

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add content/data/analytics.json
          if [ -f content/data/analytics-summary.json ]; then
            git add content/data/analytics-summary.json
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "23 0 * * *" ]; then
            git add *.html sitemap.xml feed.xml
          fi

          git commit -m "chore: analytics update" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main

name: CDN Audit (مؤقت — يُحذف بعد أخذ البصمات)

on:
  push:
    branches:
      - arena/01a0fd0d-kinanmjeed88-github-io
    paths:
      - ".github/workflows/cdn-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الفرع
        uses: actions/checkout@v4
        with:
          ref: arena/01a0fd0d-kinanmjeed88-github-io
          fetch-depth: 1

      - name: "تنزيل Tailwind 3.4.17 للاستضافة الذاتية + كتابة إشعارات الطرف الثالث"
        run: |
          mkdir -p assets/vendor
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          URL="https://cdn.tailwindcss.com/3.4.17"
          DEST="assets/vendor/tailwind-3.4.17.min.js"
          curl -sSL -A "$UA" -o "$DEST" "$URL"
          SIZE=$(wc -c < "$DEST")
          echo "الحجم: $SIZE بايت"
          test "$SIZE" -gt 300000 || { echo "❌ الملف أصغر من المتوقع"; exit 1; }
          grep -q "tailwind" "$DEST" || { echo "❌ الملف لا يبدو بناء Tailwind"; exit 1; }
          head -c 120 "$DEST" | tr '\n' ' '; echo
          SRI384="sha384-$(openssl dgst -sha384 -binary "$DEST" | openssl base64 -A)"
          SRI256="sha256-$(openssl dgst -sha256 -binary "$DEST" | openssl base64 -A)"
          echo "INTEGRITY384=$SRI384"
          echo "INTEGRITY256=$SRI256"
          node -e "require('vm').Script(require('fs').readFileSync('$DEST','utf8')); console.log('✅ الملف صالح نحوياً')"
          cat > assets/vendor/THIRD-PARTY-NOTICES.md <<EOF
          # إشعارات مكتبات الطرف الثالث

          ## Tailwind CSS — Play CDN build v3.4.17 (مستضاف ذاتياً)
          - **المصدر الأصلي:** $URL
          - **الترخيص:** MIT © Tailwind Labs, Inc.
          - **سبب الاستضافة الذاتية:** خادم \`cdn.tailwindcss.com\` لا يرسل ترويسة \`Access-Control-Allow-Origin\`
            (تم التحقق عملياً بواسطة مهمة Actions)، لذا لا يمكن استخدام Subresource Integrity (SRI) معه،
            لأن المتصفح يمنع التحقق من التكامل للموارد عبر الأصل بدون CORS. الاستضافة الذاتية تُلغي
            الاعتماد على أي طرف ثالث وقت التشغيل وتسمح بالتحقق من البصمة.
          - **SHA-384 (Integrity):** $SRI384
          - **SHA-256:** $SRI256
          - **الحجم:** $SIZE بايت
          - **تاريخ الجلب:** $(date -u +%Y-%m-%d)

          ## Lucide Icons v1.50.0
          - **المصدر:** https://unpkg.com/lucide@1.50.0/dist/umd/lucide.min.js
          - **الترخيص:** ISC © Lucide Contributors
          - **SRI (SHA-384):** sha384-/sIySnlbVLfPSNdgy7yqanP6+Dv4en7FlBure4Rag0mp480bA2f+nTviC6933zkQ
          - يُحمَّل من CDN مع \`integrity\` + \`crossorigin="anonymous"\` (unpkg يرسل \`Access-Control-Allow-Origin: *\`).
          EOF
          echo "---- التقرير ----"
          cat assets/vendor/THIRD-PARTY-NOTICES.md

      - name: حفظ الملفات في الفرع (سجلات Actions غير قابلة للتنزيل من بيئة العمل)
        run: |
          git config user.name "cdn-audit"
          git config user.email "cdn-audit@users.noreply.github.com"
          git add assets/vendor/
          git commit -m "chore(vendor): استضافة ذاتية لـ Tailwind 3.4.17 + إشعارات الطرف الثالث" || echo "لا تغييرات"
          git push origin HEAD:arena/01a0fd0d-kinanmjeed88-github-io

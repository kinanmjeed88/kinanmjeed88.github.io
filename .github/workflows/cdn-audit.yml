name: CDN Audit (مؤقت — يُحذف بعد أخذ البصمات)

on:
  push:
    branches:
      - arena/01a0fd0d-kinanmjeed88-github-io
    paths:
      - ".github/workflows/cdn-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الفرع
        uses: actions/checkout@v4
        with:
          ref: arena/01a0fd0d-kinanmjeed88-github-io
          fetch-depth: 1

      - name: "فحص Font Awesome 6.5.1 (cdnjs) — بصمة SRI + رؤوس CORS"
        continue-on-error: true
        run: |
          mkdir -p /tmp/logs
          exec > /tmp/logs/fa.log 2>&1
          set -x
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          URL="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          curl -sSL -A "$UA" -o /tmp/fa.css "$URL"
          echo "SIZE=$(wc -c < /tmp/fa.css)"
          head -c 200 /tmp/fa.css; echo
          echo "SRI384=sha384-$(openssl dgst -sha384 -binary /tmp/fa.css | openssl base64 -A)"
          echo "SRI256=sha256-$(openssl dgst -sha256 -binary /tmp/fa.css | openssl base64 -A)"
          echo "--- رؤوس مع Origin ---"
          curl -sSL -A "$UA" -H "Origin: https://kinantouch.com" -D - -o /dev/null "$URL" | tr -d '\r' | grep -iE '^(HTTP/|access-control|content-type|cache-control|last-modified)'
          echo "DONE"

      - name: حفظ النتائج في الفرع (حتى عند الفشل)
        if: always()
        run: |
          cp /tmp/logs/fa.log cdn-fa-report.txt 2>/dev/null || echo "لا سجل" > cdn-fa-report.txt
          git config user.name "cdn-audit"
          git config user.email "cdn-audit@users.noreply.github.com"
          git add cdn-fa-report.txt
          git commit -m "chore(ci): تقرير Font Awesome المؤقت" || echo "لا تغييرات"
          git push origin HEAD:arena/01a0fd0d-kinanmjeed88-github-io || echo "فشل الدفع"

# ============================================================
#  إصلاح إعداد نشر GitHub Pages (يُشغَّل يدوياً)
#
#  السبب الجذري لتعطّل مهمة "pages build and deployment":
#    كان مصدر النشر مضبوطاً على الفرع main والمجلد /docs
#    (مجلد غير موجود في المستودع)، بينما ملفات الموقع في الجذر.
#    نتيجة ذلك: فشل خطوة Jekyll بالخطأ
#      "No such file or directory @ dir_chdir0 - /github/workspace/docs"
#    وتوقّف خط النشر كاملاً (لم يُنشر أي تحديث منذ 2026-10-02).
#
#  هذه المهمة تعيد ضبط مصدر النشر إلى main:/ ثم تطلب بناءً جديداً.
#  تُشغَّل عبر workflow_dispatch فقط، وبصلاحية pages: write الخاصة
#  بالمستودع (الصلاحية غير متاحة لاتصال الأداة الخارجي).
#  المخرجات تُطبع كتعليقات (annotations) ليمكن قراءتها والتحقق منها.
# ============================================================
name: Fix GitHub Pages Source (يدوي)

on:
  # ملاحظة: workflow_dispatch لا يعمل إلا إذا كان الملف موجوداً على الفرع الافتراضي،
  # لذلك يُشغَّل هذا الملف المؤقت عند الدفع إلى فرع المراجعة المحدد فقط.
  push:
    branches:
      - 'arena/01a10259-kinanmjeed88-github-io'
    paths:
      - '.github/workflows/pages-config.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  fix-pages-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== configuration BEFORE ===" | tee -a /tmp/report.txt
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/before.json | tee -a /tmp/report.txt

      - name: Set publishing source to main branch, root folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== PUT source[branch]=main source[path]=/ ===" >> /tmp/report.txt
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f 'source[branch]=main' \
            -f 'source[path]=/' \
            -f 'build_type=legacy' >> /tmp/report.txt 2>&1 \
            || echo "PUT_FAILED" >> /tmp/report.txt
          echo "=== configuration AFTER ===" >> /tmp/report.txt
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/after.json >> /tmp/report.txt 2>&1 || true

      - name: Request a fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== request build ===" >> /tmp/report.txt
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >> /tmp/report.txt 2>&1 \
            || echo "BUILD_REQUEST_FAILED" >> /tmp/report.txt

      - name: Publish report as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os
          try:
              data = open('/tmp/report.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              data = 'no report produced'
          for i in range(0, max(len(data), 1), 1500):
              part = data[i:i + 1500]
              esc = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=pages-config-{i // 1500}::{esc}')
          PY

      - name: Fail if the configuration is still wrong
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              cfg = json.load(open('/tmp/after.json'))
          except Exception:
              cfg = json.load(open('/tmp/before.json'))
          src = cfg.get('source') or {}
          ok = src.get('branch') == 'main' and src.get('path') == '/'
          print('effective source:', src, 'status:', cfg.get('status'))
          sys.exit(0 if ok else 1)
          PY

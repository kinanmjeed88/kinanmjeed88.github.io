name: CSP Verify (مؤقت — يُحذف بعد التحقق)

on:
  push:
    branches:
      - arena/01a0fd0d-kinanmjeed88-github-io
    paths:
      - ".github/workflows/csp-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: "جلب الفرع"
        uses: actions/checkout@v4
        with:
          ref: arena/01a0fd0d-kinanmjeed88-github-io
          fetch-depth: 1

      - name: "انتظار نشر Cloudflare Pages + فحص الترويسات الفعلية"
        id: hdr
        run: |
          URL="https://arena-01a0fd0d-kinanmjeed88.kinantouch-com.pages.dev/"
          OUT=csp-verify-report.txt
          : > "$OUT"
          echo "=== انتظار النشر ===" >> "$OUT"
          for i in $(seq 1 24); do
            code=$(curl -s -o /tmp/home.html -w '%{http_code}' -m 20 "$URL")
            csp=$(curl -sI -m 20 "$URL" | tr -d '\r' | grep -i '^content-security-policy:' | head -1)
            echo "محاولة $i: HTTP=$code | CSP=$([ -n "$csp" ] && echo موجود || echo غير موجود)" >> "$OUT"
            [ "$code" = "200" ] && [ -n "$csp" ] && break
            sleep 15
          done
          echo "" >> "$OUT"
          echo "=== الترويسات التي يرسلها Cloudflare فعلياً ===" >> "$OUT"
          curl -sI -m 20 "$URL" | tr -d '\r' | grep -iE '^(HTTP/|strict-transport-security|x-content-type-options|x-frame-options|referrer-policy|permissions-policy|content-security-policy)' >> "$OUT"
          echo "" >> "$OUT"
          echo "=== مطابقة CSP المنشورة مع الملف المحلي ===" >> "$OUT"
          local_csp=$(grep -o 'Content-Security-Policy: .*' _headers | sed 's/^Content-Security-Policy: //')
          served_csp=$(curl -sI -m 20 "$URL" | tr -d '\r' | grep -i '^content-security-policy:' | sed 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy: //')
          if [ "$local_csp" = "$served_csp" ]; then echo "✅ مطابقة تامة" >> "$OUT"; else echo "⚠️ اختلاف:" >> "$OUT"; echo "محلي : $local_csp" >> "$OUT"; echo "منشور: $served_csp" >> "$OUT"; fi
          cat "$OUT"

      - name: "تحقق بمتصفح Chrome حقيقي (انتهاكات CSP + أخطاء Console + الموارد المرفوضة)"
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@23 --no-audit --no-fund --silent >/dev/null 2>&1
          echo "Chrome: $(ls -la /usr/bin/google-chrome* /usr/bin/chromium* 2>/dev/null | head -3)"
          cat > verify.cjs <<'JS'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');
          const BASE = 'https://arena-01a0fd0d-kinanmjeed88.kinantouch-com.pages.dev';
          const PAGES = [
            ['/', 'الصفحة الرئيسية'],
            ['/article-nasa-earth-space.html', 'مقال (يوتيوب + Font Awesome + تعقيم)'],
            ['/tools.html', 'صفحة أدوات'],
            ['/tool-analysis.html', 'أداة AI (importmap من esm.sh)'],
            ['/admin/', 'لوحة التحكم CMS'],
          ];
          const CHROME = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'].find(p => fs.existsSync(p));
          (async () => {
            const out = [];
            const browser = await puppeteer.launch({ executablePath: CHROME, headless: 'new', args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu'] });
            let totalViolations = 0;
            for (const [p, label] of PAGES) {
              const page = await browser.newPage();
              await page.setViewport({ width: 1366, height: 900 });
              const violations = [], consoleErr = [], failed = [];
              await page.evaluateOnNewDocument(() => {
                window.__cspV = [];
                document.addEventListener('securitypolicyviolation', (e) => {
                  window.__cspV.push({ directive: e.violatedDirective, blocked: e.blockedURI, disposition: e.disposition });
                });
              });
              page.on('console', (m) => {
                const t = m.text();
                if (m.type() === 'error' && /content security policy|refused to|violates the following/i.test(t)) consoleErr.push(t.slice(0, 200));
              });
              page.on('requestfailed', (r) => failed.push(`${r.failure()?.errorText} ${r.url().slice(0, 120)}`));
              let docHeaders = {};
              try {
                const resp = await page.goto(BASE + p, { waitUntil: 'networkidle2', timeout: 90000 });
                docHeaders = resp ? resp.headers() : {};
              } catch (e) { out.push(`❌ ${label} (${p}): فشل التحميل — ${e.message}`); }
              await new Promise((r) => setTimeout(r, 4000));
              const pageViolations = await page.evaluate(() => window.__cspV || []);
              violations.push(...pageViolations);
              totalViolations += violations.length;
              out.push(`### ${label} — ${p}`);
              out.push(`   ترويسة CSP على المستند : ${docHeaders['content-security-policy'] ? 'موجودة ✅' : 'غائبة ❌'}`);
              out.push(`   HSTS / nosniff / XFO   : ${docHeaders['strict-transport-security'] ? '✅' : '❌'} / ${docHeaders['x-content-type-options'] ? '✅' : '❌'} / ${docHeaders['x-frame-options'] ? '✅' : '❌'}`);
              out.push(`   انتهاكات CSP           : ${violations.length === 0 ? 'صفر ✅' : violations.length + ' ❌'}`);
              violations.slice(0, 8).forEach((v) => out.push(`      ← [${v.directive}] ${v.blocked}`));
              out.push(`   رسائل Console أمنية    : ${consoleErr.length === 0 ? 'لا شيء ✅' : consoleErr.length + ' ❌'}`);
              consoleErr.slice(0, 5).forEach((t) => out.push(`      ← ${t}`));
              out.push(`   موارد فشل تحميلها       : ${failed.length === 0 ? 'لا شيء ✅' : failed.length}`);
              failed.slice(0, 6).forEach((f) => out.push(`      ← ${f}`));
              out.push('');
              await page.close();
            }
            await browser.close();
            const report = `\n=== تحقق متصفح Chrome (CSP) ===\nالمجموع الكلي لانتهاكات CSP: ${totalViolations}\n\n` + out.join('\n');
            fs.appendFileSync('csp-verify-report.txt', report);
            console.log(report);
            process.exit(totalViolations === 0 ? 0 : 1);
          })().catch((e) => { fs.appendFileSync('csp-verify-report.txt', '\nفشل السكربت: ' + e.message + '\n'); console.error(e); process.exit(1); });
          JS
          node verify.cjs

      - name: "حفظ التقرير في الفرع (ثم يُحذف بعد القراءة)"
        if: always()
        run: |
          git config user.name "csp-verify"
          git config user.email "csp-verify@users.noreply.github.com"
          git add -f csp-verify-report.txt
          git commit -m "chore(ci): تقرير تحقق CSP بمتصفح حقيقي (مؤقت)" || echo "لا تغييرات"
          git push origin HEAD:arena/01a0fd0d-kinanmjeed88-github-io || echo "فشل الدفع"

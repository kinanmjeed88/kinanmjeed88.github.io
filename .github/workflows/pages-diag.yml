# ============================================================
#  مهمة تشخيصية مؤقتة (تُحذف بعد التشخيص)
#  الهدف: إعادة إنتاج بناء GitHub Pages (خط Jekyll القديم) بجذر المستودع
#  لنعرف بالضبط هل ينجح البناء عند ضبط المصدر على "/" بدلاً من "/docs".
#  المخرجات تُكتب كتعليقات (annotations) على تشغيل المهمة لأن سجلات
#  Actions غير قابلة للتحميل من بيئة العمل الحالية.
# ============================================================
name: Pages Build Diag (مؤقت)

on:
  push:
    branches:
      - 'arena/01a10259-kinanmjeed88-github-io'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reproduce legacy GitHub Pages build with source="/"
        id: build
        run: |
          set +e
          docker run --rm \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e GITHUB_API_URL="${GITHUB_API_URL}" \
            -e INPUT_SOURCE=./ \
            -e INPUT_DESTINATION=./_diag_site \
            -e INPUT_TOKEN="${GITHUB_TOKEN}" \
            -e INPUT_VERBOSE=true \
            -v "${PWD}:/github/workspace" \
            ghcr.io/actions/jekyll-build-pages:v1.0.13 > /tmp/jekyll.log 2>&1
          echo "exit_code=$?" >> /tmp/result.txt
          echo "--- files produced ---" >> /tmp/result.txt
          echo "count=$(find ./_diag_site -type f 2>/dev/null | wc -l)" >> /tmp/result.txt
          ls ./_diag_site 2>/dev/null | head -30 >> /tmp/result.txt
          echo "--- conflict/warning lines ---" >> /tmp/result.txt
          grep -iE "conflict|warn|error|deprecat" /tmp/jekyll.log | head -40 >> /tmp/result.txt
          echo "--- tail of build log ---" >> /tmp/result.txt
          tail -c 3000 /tmp/jekyll.log >> /tmp/result.txt
          cat /tmp/result.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish result as annotations
        if: always()
        run: |
          python3 - <<'PY'
          path = '/tmp/result.txt'
          try:
              data = open(path, encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              data = 'result file missing'
          chunk = 1500
          for i in range(0, len(data), chunk):
              part = data[i:i + chunk]
              esc = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              level = 'error' if i == 0 else 'notice'
              print(f'::{level} title=diag-part-{i // chunk}::{esc}')
          PY

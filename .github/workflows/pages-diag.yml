# ============================================================
#  مهمة تشخيصية مؤقتة (تُحذف بعد التشخيص)
#  الهدف: معرفة هل يتجاوز بناء GitHub Pages (صورة jekyll-build-pages)
#  معالجة Jekyll عند وجود ملف .nojekyll، أي هل تُنشر الملفات كما هي
#  (نسخة مطابقة لاستضافة Cloudflare Pages) بدل تحويلها عبر Jekyll.
# ============================================================
name: Pages Build Diag (مؤقت)

on:
  push:
    branches:
      - 'arena/01a10259-kinanmjeed88-github-io'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test .nojekyll pass-through (source="/")
        id: build
        run: |
          set +e
          touch .nojekyll
          docker run --rm \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e GITHUB_API_URL="${GITHUB_API_URL}" \
            -e INPUT_SOURCE=./ \
            -e INPUT_DESTINATION=./_diag_site \
            -e INPUT_TOKEN="${GITHUB_TOKEN}" \
            -e INPUT_VERBOSE=true \
            -v "${PWD}:/github/workspace" \
            ghcr.io/actions/jekyll-build-pages:v1.0.13 > /tmp/jekyll.log 2>&1
          echo "exit_code=$?" > /tmp/result.txt
          echo "--- jekyll ran? ---" >> /tmp/result.txt
          grep -cE "Generating|Rendering" /tmp/jekyll.log >> /tmp/result.txt
          echo "--- _headers published? ---" >> /tmp/result.txt
          echo "headers_file=$(test -f ./_diag_site/_headers && echo YES || echo NO)" >> /tmp/result.txt
          echo "--- README kept as .md ? ---" >> /tmp/result.txt
          echo "readme_md=$(test -f ./_diag_site/README.md && echo YES || echo NO) readme_html=$(test -f ./_diag_site/README.html && echo YES || echo NO)" >> /tmp/result.txt
          echo "--- theme css written? ---" >> /tmp/result.txt
          echo "theme_css=$(test -f ./_diag_site/assets/css/style.css && echo YES || echo NO)" >> /tmp/result.txt
          echo "--- head of log ---" >> /tmp/result.txt
          head -c 2500 /tmp/jekyll.log >> /tmp/result.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish result as annotations
        if: always()
        run: |
          python3 - <<'PY'
          path = '/tmp/result.txt'
          try:
              data = open(path, encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              data = 'result file missing'
          chunk = 1500
          for i in range(0, len(data), chunk):
              part = data[i:i + chunk]
              esc = part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=diag-part-{i // chunk}::{esc}')
          PY

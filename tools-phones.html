    <script type="module">
        let phonesDatabase = [];
        try {
            const res = await fetch('content/data/phones.json');
            phonesDatabase = await res.json();
        } catch(e) {
            console.error('Failed to load phones database:', e);
        }

        const brandSelect = document.getElementById('brandSelect');
        const modelSelect = document.getElementById('modelSelect');
        const searchInput = document.getElementById('searchInput');
        const searchSuggestions = document.getElementById('searchSuggestions');
        const specsCard = document.getElementById('specsCard');
        const displayBrand = document.getElementById('displayBrand');
        const displayName = document.getElementById('displayName');
        const specsGrid = document.getElementById('specsGrid');
        // Make specs grid more compact
        specsGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';

        const specConfig = { "chipset": { label: "المعالج", icon: "cpu" }, "ram": { label: "الرام (RAM)", icon: "memory-stick" }, "storage": { label: "التخزين", icon: "hard-drive" }, "screen": { label: "الشاشة", icon: "smartphone" }, "battery": { label: "البطارية", icon: "battery-charging" }, "camera": { label: "الكاميرا", icon: "camera" } };
        const allPhones = [];
        phonesDatabase.forEach(brand => { brand.phones.forEach(phone => { allPhones.push({ ...phone, brand: brand.brand }); }); });
        function renderSpecs(phone, brandName) {
            
            displayBrand.textContent = brandName; 
            displayName.textContent = phone.name; 
            specsGrid.innerHTML = '';
            
            // Image handling
            let specsCard = document.getElementById('specsCard');
            let imgContainer = document.getElementById('phoneImageContainer');
            if (!imgContainer) {
                imgContainer = document.createElement('div');
                imgContainer.id = 'phoneImageContainer';
                imgContainer.className = 'h-32 md:h-48 w-full shrink-0 mx-auto flex items-center justify-center overflow-hidden mb-6';
                
                // Insert after the title header in specsCard, or just before specsGrid
                specsGrid.parentNode.insertBefore(imgContainer, specsGrid);
            }
            if (phone.image) {
                imgContainer.innerHTML = `<img src="${phone.image}" alt="${phone.name}" class="h-full w-auto max-w-full object-contain p-2 mx-auto" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOUNBM0FGIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHJlY3QgeD0iNSIgeT0iMiIgd2lkdGg9IjE0IiBoZWlnaHQ9IjIwIiByeD0iMiIgcnk9IjIiPjwvcmVjdD48bGluZSB4MT0iMTIiIHkxPSIxOCIgeDI9IjEyLjAxIiB5Mj0iMTgiPjwvbGluZT48L3N2Zz4=';">`;
                imgContainer.style.display = 'flex';
            } else {
                imgContainer.innerHTML = `<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOUNBM0FGIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHJlY3QgeD0iNSIgeT0iMiIgd2lkdGg9IjE0IiBoZWlnaHQ9IjIwIiByeD0iMiIgcnk9IjIiPjwvcmVjdD48bGluZSB4MT0iMTIiIHkxPSIxOCIgeDI9IjEyLjAxIiB5Mj0iMTgiPjwvbGluZT48L3N2Zz4=" alt="Phone Placeholder" class="h-full w-auto max-w-full object-contain p-2 mx-auto opacity-30">`;
                imgContainer.style.display = 'flex';
            }

            for (const [key, value] of Object.entries(phone.specs)) {
                const config = specConfig[key] || { label: key, icon: "info" };
                const item = document.createElement('div');
                item.className = "flex items-start gap-4 p-4 bg-gray-50 dark:bg-gray-900/50 rounded-2xl border border-gray-100 dark:border-gray-700 hover:shadow-md transition-all";
                item.innerHTML = `<div class="p-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm text-purple-600 dark:text-purple-400 shrink-0"><i data-lucide="${config.icon}" class="w-6 h-6"></i></div><div><h4 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">${config.label}</h4><p class="text-gray-900 dark:text-white font-bold text-base leading-tight">${value}</p></div>`;
                specsGrid.appendChild(item);
            }
            specsCard.classList.remove('hidden');
            if(window.lucide) window.lucide.createIcons();
            specsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        phonesDatabase.forEach(brand => { const option = document.createElement('option'); option.value = brand.brand; option.textContent = brand.brand; brandSelect.appendChild(option); });
        brandSelect.addEventListener('change', (e) => {
            const selectedBrand = e.target.value; modelSelect.innerHTML = '<option value="">اختر الموديل</option>'; modelSelect.disabled = true; specsCard.classList.add('hidden');
            if (selectedBrand) { const brandData = phonesDatabase.find(b => b.brand === selectedBrand); if (brandData) { brandData.phones.forEach(phone => { const option = document.createElement('option'); option.value = phone.id; option.textContent = phone.name; modelSelect.appendChild(option); }); modelSelect.disabled = false; } }
        });
        modelSelect.addEventListener('change', (e) => { const phoneId = e.target.value; if (phoneId) { const selectedPhone = allPhones.find(p => p.id === phoneId); if (selectedPhone) { renderSpecs(selectedPhone, selectedPhone.brand); } } });
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim(); searchSuggestions.innerHTML = ''; searchSuggestions.classList.add('hidden');
            if (query.length > 0) {
                const matches = allPhones.filter(phone => phone.name.toLowerCase().includes(query) || phone.brand.toLowerCase().includes(query));
                if (matches.length > 0) {
                    searchSuggestions.classList.remove('hidden');
                    matches.slice(0, 6).forEach(phone => {
                        const div = document.createElement('div'); div.className = "p-3 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer border-b border-gray-100 dark:border-gray-700 last:border-0 flex items-center gap-3 transition-colors";
                        div.innerHTML = `<div class="w-8 h-8 rounded-full bg-purple-100 dark:bg-purple-900 flex items-center justify-center text-purple-600 dark:text-purple-300 font-bold text-xs shrink-0">${phone.brand.substring(0, 2).toUpperCase()}</div><div><div class="text-sm font-bold text-gray-900 dark:text-white">${phone.name}</div><div class="text-xs text-gray-500">${phone.brand}</div></div>`;
                        div.addEventListener('click', () => { renderSpecs(phone, phone.brand); searchInput.value = phone.name; searchSuggestions.classList.add('hidden'); brandSelect.value = ""; modelSelect.innerHTML = '<option value="">اختر الموديل</option>'; modelSelect.disabled = true; }); searchSuggestions.appendChild(div);
                    });
                }
            }
        });
        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) { searchSuggestions.classList.add('hidden'); } });
    
        // Auto display recent phones
        const recentPhonesContainer = document.createElement('div');
        recentPhonesContainer.className = 'mt-12';
        recentPhonesContainer.innerHTML = '<h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6 border-b border-gray-200 dark:border-gray-700 pb-2">أحدث الهواتف المضافة</h2><div id="recentPhonesGrid" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-4"></div>';
        
        // Find main container to append to
        const mainCard = document.querySelector('main > div');
        if(mainCard) {
            mainCard.appendChild(recentPhonesContainer);
        }

        function renderRecentPhones() {
            const grid = document.getElementById('recentPhonesGrid');
            if(!grid) return;
            grid.innerHTML = '';
            
            // Get last 8 phones overall (assuming they are appended to the end of their respective arrays or just sorted by something)
            // The JSON doesn't have a date, so we'll just take the last phone of each brand, up to 8.
            let recents = [];
            phonesDatabase.forEach(b => {
                if(b.phones.length > 0) {
                    recents.push({...b.phones[b.phones.length - 1], brand: b.brand});
                }
            });
            // If we need more, take the second to last, etc.
            if(recents.length < 8) {
                phonesDatabase.forEach(b => {
                    if(b.phones.length > 1 && recents.length < 8) {
                        recents.push({...b.phones[b.phones.length - 2], brand: b.brand});
                    }
                });
            }
            
            recents.slice(0, 8).forEach(phone => {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm cursor-pointer hover:shadow-md transition-shadow flex flex-col items-center text-center';
                
                const imgStr = phone.image ? `<img src="${phone.image}" class="h-24 w-auto object-contain mb-3">` : `<div class="h-24 w-24 bg-gray-100 dark:bg-gray-700 rounded-lg mb-3 flex items-center justify-center"><i data-lucide="smartphone" class="text-gray-400"></i></div>`;
                
                card.innerHTML = `
                    ${imgStr}
                    <h3 class="font-bold text-[11px] sm:text-sm text-gray-900 dark:text-white line-clamp-1">${phone.name}</h3>
                    <p class="text-[9px] sm:text-xs text-gray-500 mt-0.5 sm:mt-1">${phone.brand}</p>
                `;
                
                card.onclick = () => {
                    searchInput.value = phone.name;
                    brandSelect.value = phone.brand;
                    // trigger brand select change
                    brandSelect.dispatchEvent(new Event('change'));
                    modelSelect.value = phone.id;
                    renderSpecs(phone, phone.brand);
                };
                
                grid.appendChild(card);
            });
            if(window.lucide) window.lucide.createIcons();
        }
        
        renderRecentPhones();

    </script>
